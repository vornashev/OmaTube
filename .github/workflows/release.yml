name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify version and changelog
        env:
          TAG: ${{ github.ref_name }}
        run: scripts/check.sh --tag "$TAG"

      - name: Build release assets
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          archive="omatube-${TAG}.tar.gz"
          xpi="omatube-firefox-${TAG}.xpi"
          git archive --format=tar.gz --prefix="omatube-${TAG}/" -o "$archive" "$TAG"
          scripts/build-firefox-extension.sh browser-extension/src "$RUNNER_TEMP/firefox" "$xpi"
          sha256sum "$archive" "$xpi" > SHA256SUMS
          scripts/changelog-section.sh "${TAG#v}" > notes.md

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" \
            "omatube-${TAG}.tar.gz" \
            "omatube-firefox-${TAG}.xpi" \
            SHA256SUMS \
            --verify-tag \
            --notes-file notes.md \
            --title "OmaTube ${TAG}"
