name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Repository checks
        run: scripts/check.sh

      - name: Install backend dependencies
        run: |
          python -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: --no-deps -r requirements.lock

      - name: Backend tests
        run: python -m unittest discover -s tests

      - name: Browser extension tests
        run: node --test browser-extension/lib/

      - name: Catalog dependencies and youtubei.js patch
        run: |
          npm ci --ignore-scripts
          node scripts/patch-youtubei.mjs
